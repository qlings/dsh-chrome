name: release

# 推 v* tag 即发版：校验版本 → 跑测试 → 打包 → 建 Release → 上传附件。
# 手动跑（workflow_dispatch）只打包并上传 artifact，不发 Release。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自测 + 打包
        shell: powershell
        run: ./scripts/build.ps1

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          # 注意：run 块里不要写中文 —— windows runner 用 powershell 5.1 执行临时脚本，
          # 文件是 UTF-8 无 BOM，中文会被按 ANSI 读成乱码并导致语法错误。
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($v -ne $tag) { Write-Error "tag=$tag but package.json=$v"; exit 1 }
          Write-Host "version $v OK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-chrome-dist
          path: dist/*

      - name: 建 Release 并上传附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: false
          body_path: .github/RELEASE_BODY.md
